[project]
name = "async-multi-api-fetcher-cli"
version = "0.1.0"
description = "CLI that fetches several public APIs concurrently with asyncio and httpx"
readme = "README.md"
authors = [
    { name = "Mihir Kansal", email = "mihirkansal7@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
]

[project.scripts]
async-multi-api-fetcher-cli = "async_multi_api_fetcher_cli:main"

[dependency-groups]
dev = ["mypy>=1.0"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
